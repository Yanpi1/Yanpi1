   <path d="M1062 93 l4 4 -4 4 M1070 101h8" stroke="#5CC8AC" stroke-width="1.5" fill="none"/>
   <g font-family="Consolas,'Courier New',monospace" font-size="18">
    <text x="711" y="158" fill="#81DAF3">const <tspan fill="#F2FBF7">yan</tspan> = <tspan fill="#E2DAA9">{</tspan></text>
    <text x="735" y="190" fill="#B9C9C7">role: <tspan fill="#82E6C0">'developer + designer'</tspan>,</text>
    <text x="735" y="222" fill="#B9C9C7">focus: <tspan fill="#82E6C0">['web', 'mobile']</tspan>,</text>
    <text x="735" y="254" fill="#B9C9C7">mindset: <tspan fill="#82E6C0">'always building'</tspan></text>
    <text x="711" y="286" fill="#E2DAA9">}</text>
   </g>
   <circle cx="712" cy="308" r="4" fill="#5CEDB8"/>
   <text x="725" y="313" font-family="Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.5" fill="#98C2B2">DESIGN MEETS ENGINEERING</text>
