  <text x="66" y="260" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#F3FCF8">Desenvolvedor de Sistemas</text>
  <text x="66" y="299" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#65EBC1">&amp; Web Designer</text>
  <text x="67" y="337" font-family="Consolas,'Courier New',monospace" font-size="15" letter-spacing=".8" fill="#A1BAB8">WEB  <tspan fill="#527876">/</tspan>  MOBILE  <tspan fill="#527876">/</tspan>  UI/UX  <tspan fill="#527876">/</tspan>  AUTOMATION</text>
  <g>
