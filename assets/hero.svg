<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
 <title id="t">YAN — Desenvolvedor de Sistemas e Web Designer</title>
 <desc id="d">Banner profissional escuro com linhas de luz iridescentes, tipografia marcante e uma janela de código.</desc>
 <defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#070B12"/><stop offset=".52" stop-color="#0C1420"/><stop offset="1" stop-color="#071714"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
   <stop stop-color="#5EF6C1"/><stop offset=".56" stop-color="#5CD6E9"/><stop offset="1" stop-color="#A194FF"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
   <stop stop-color="#F87282" stop-opacity="0"/><stop offset=".22" stop-color="#FA9D68"/><stop offset=".49" stop-color="#F5E5A0"/><stop offset=".69" stop-color="#53F5C2"/><stop offset=".85" stop-color="#4AB6E8"/><stop offset="1" stop-color="#AB8CFF" stop-opacity=".12"/>
  </linearGradient>
  <radialGradient id="orb"><stop stop-color="#52E8C1" stop-opacity=".22"/><stop offset="1" stop-color="#52E8C1" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow"><stop stop-color="#FA9D76" stop-opacity=".16"/><stop offset="1" stop-color="#FA9D76" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#6F9B97" stroke-opacity=".10" stroke-width="1"/></pattern>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9CF9D9" opacity=".29"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="19"/></filter>
  <filter id="fineBlur"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="clip"><rect width="1200" height="400" rx="22"/></clipPath>
 </defs>
 <g clip-path="url(#clip)">
