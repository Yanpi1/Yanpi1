 <circle cx="22" cy="22" r="5" fill="#ef8274"/><circle cx="40" cy="22" r="5" fill="#f3bd65"/><circle cx="58" cy="22" r="5" fill="#55cc95"/>
 <text x="155" y="27" fill="#99b7a9" font-size="13" font-family="Consolas,Monaco,monospace">about.js</text>
 <g font-family="Consolas,Monaco,monospace" font-size="17">
  <text x="26" y="78" fill="#e5f7ef"><tspan fill="#7dd3fc">const</tspan> developer <tspan fill="#6ee7b7">=</tspan> {</text>
