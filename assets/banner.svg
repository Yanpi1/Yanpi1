<rect x="58" y="57" width="7" height="230" rx="3" fill="url(#accent)"/>
<text x="92" y="84" font-size="16" letter-spacing="4" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#7dd3ac">PORTFÓLIO / DESENVOLVIMENTO</text>
<text x="87" y="180" font-size="92" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#f0fdf4">YAN<tspan fill="#34d399">.</tspan></text>
<text x="93" y="224" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="600" fill="#e5f4ed">Desenvolvimento de sistemas</text>
<text x="93" y="259" font-size="17" font-family="Arial,Helvetica,sans-serif" fill="#a5bcb3">Web  /  Mobile  /  APIs  /  Automação</text>
