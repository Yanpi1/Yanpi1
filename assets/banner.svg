  <text x="52" y="148" fill="#d0e6da">focus: [<tspan fill="#fcd34d">"Web"</tspan>, <tspan fill="#fcd34d">"Mobile"</tspan>],</text>
  <text x="52" y="183" fill="#d0e6da">mindset: <tspan fill="#fcd34d">"Keep improving"</tspan></text>
  <text x="26" y="218" fill="#e5f7ef">};<tspan fill="#34d399"> ▌</tspan></text>
 </g>
