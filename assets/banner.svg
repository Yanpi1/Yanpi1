<text x="126" y="303" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#d3f8df">CONSTRUINDO SOLUÇÕES REAIS</text>
<g transform="translate(653,49)">
 <rect x="0" y="0" width="455" height="252" rx="16" fill="url(#pane)" stroke="#335448" stroke-width="1.5"/>
