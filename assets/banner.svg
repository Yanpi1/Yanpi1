<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-labelledby="title description">
  <title id="title">YAN. — Desenvolvedor de sistemas e Web Designer</title>
  <desc id="description">Banner minimalista escuro com detalhes verdes, textura halftone sutil e texto de apresentação de Yan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117" />
      <stop offset="1" stop-color="#0d1d1b" />
    </linearGradient>
    <radialGradient id="halftone-fade" cx="72%" cy="48%" r="62%">
      <stop offset="0" stop-color="white" stop-opacity="0.85" />
      <stop offset="0.65" stop-color="white" stop-opacity="0.45" />
      <stop offset="1" stop-color="black" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#6ee7b7" opacity="0.42" />
    </pattern>
    <clipPath id="round-corners"><rect width="1160" height="300" rx="18" /></clipPath>
    <mask id="fade-mask"><rect width="1160" height="300" fill="url(#halftone-fade)" /></mask>
  </defs>

  <g clip-path="url(#round-corners)">
    <rect width="1160" height="300" fill="url(#background)" />

    <!-- Subtle geek details: halftone and a single abstract code symbol. -->
    <g mask="url(#fade-mask)">
      <rect x="735" y="0" width="425" height="300" fill="url(#dots)" />
    </g>
    <circle cx="952" cy="145" r="114" fill="none" stroke="#6ee7b7" stroke-opacity=".14" stroke-width="1.5" />
    <circle cx="952" cy="145" r="89" fill="#34d399" fill-opacity=".025" />
    <g font-family="Consolas,Monaco,monospace" font-size="85" font-weight="600" fill="#6ee7b7" opacity=".19" text-anchor="middle">
      <text x="952" y="172">&lt;/&gt;</text>
    </g>

    <rect x="58" y="50" width="4" height="202" rx="2" fill="#34d399" />
    <text x="84" y="78" fill="#70d9aa" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="3.2">PORTFÓLIO / DEV + DESIGN</text>
    <text x="78" y="165" fill="#f4f7f6" font-family="Arial,Helvetica,sans-serif" font-size="89" font-weight="800">YAN<tspan fill="#34d399">.</tspan></text>
    <text x="83" y="204" fill="#e6f0ed" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600">Desenvolvedor de sistemas</text>
    <text x="83" y="237" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="600">&amp; Web Designer</text>
    <text x="83" y="270" fill="#94afa7" font-family="Arial,Helvetica,sans-serif" font-size="17">Web  /  Mobile  /  APIs  /  Interfaces</text>

    <path d="M0 299 H1160" stroke="#34d399" stroke-opacity=".22" stroke-width="2" />
  </g>
</svg>
