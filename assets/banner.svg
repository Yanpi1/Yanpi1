<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="350" viewBox="0 0 1160 350" role="img" aria-labelledby="title desc">
<title id="title">Yan — Desenvolvedor de sistemas</title>
<desc id="desc">Banner escuro com detalhes verdes e uma janela de código, sobre desenvolvimento web e mobile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080e12"/><stop offset=".56" stop-color="#0a1716"/><stop offset="1" stop-color="#0b231b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#86efac"/></linearGradient>
  <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101d20"/><stop offset="1" stop-color="#0b1417"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#a7f3d0" stroke-opacity=".05" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
</defs>
<rect width="1160" height="350" rx="24" fill="url(#bg)"/>
<rect width="1160" height="350" rx="24" fill="url(#grid)"/>
