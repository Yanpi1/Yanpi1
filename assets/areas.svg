<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="164" viewBox="0 0 1200 164" role="img" aria-labelledby="title description">
  <title id="title">Áreas de atuação</title>
  <desc id="description">Três cartões compactos: Desenvolvimento web e mobile; Web Design e UI/UX; APIs e automação.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101b20"/>
      <stop offset="100%" stop-color="#101d1c"/>
    </linearGradient>
    <pattern id="miniDots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64d9ae" opacity=".28"/>
    </pattern>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
