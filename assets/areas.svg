      <text x="24" y="42" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#56e5b2">01</text>
      <g fill="none" stroke="#58e6b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="321" y="29" width="33" height="25" rx="4"/><path d="M321 36 H354 M337 54 V60 M329 60 H346"/>
      </g>
      <text x="24" y="90" font-size="25" font-weight="700" fill="#f1f8f6">Web &amp; Mobile</text>
      <text x="24" y="123" font-size="17" fill="#a4c3b9">Sites, sistemas e interfaces</text>
      <text x="24" y="143" font-size="17" fill="#a4c3b9">responsivas.</text>
    </g>
